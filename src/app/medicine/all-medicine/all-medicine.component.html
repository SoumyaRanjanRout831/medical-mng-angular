<div class="mat-elevation-z8">
  <h1>All Medicines</h1>
    <table mat-table [dataSource]="allMedicine">
  
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Medicine Name </th>
        <td mat-cell *matCellDef="let element"> {{element.MedicineName}} </td>
      </ng-container>
  
      <ng-container matColumnDef="manufacturer">
        <th mat-header-cell *matHeaderCellDef> Manufacuturer</th>
        <td mat-cell *matCellDef="let element"> {{element.Manufacturer}} </td>
      </ng-container>
  
      <ng-container matColumnDef="expt">
        <th mat-header-cell *matHeaderCellDef> Expiry Date </th>
        <td mat-cell *matCellDef="let element"> {{element.ExpiryDate | date}} </td>
      </ng-container>
  
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Selling Price </th>
        <td mat-cell *matCellDef="let element"> {{element.SellingPrice}} </td>
      </ng-container>

    
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
